<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>永旭智慧財產 — 文件產生器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: '微軟正黑體', 'Microsoft JhengHei', sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
}

/* ── Header ── */
header {
  background: #fff;
  border-bottom: 2px solid #e8e8e8;
  padding: 12px 28px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
header img {
  height: 46px;
  width: auto;
  object-fit: contain;
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  color: #1a3a2a;
  letter-spacing: 1px;
}

/* ── Main ── */
.wrap {
  max-width: 860px;
  margin: 48px auto;
  padding: 0 20px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: #888;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 18px;
}

/* ── 4 按鈕 ── */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-bottom: 48px;
}
@media (max-width: 560px) {
  .btn-grid { grid-template-columns: 1fr; }
}

.doc-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 36px 20px;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  color: #fff;
  font-family: inherit;
}
.doc-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
}
.doc-btn:active { transform: translateY(0); }

.doc-btn .icon { font-size: 40px; line-height: 1; }
.doc-btn .label { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
.doc-btn .sub { font-size: 12px; opacity: .82; letter-spacing: .5px; }

.btn-patent    { background: linear-gradient(135deg, #2c5f2e 0%, #4a8f3f 100%); }
.btn-trademark { background: linear-gradient(135deg, #7d4e1f 0%, #b07030 100%); }
.btn-copyright { background: linear-gradient(135deg, #1a4a7a 0%, #2e78c8 100%); }
.btn-legal     { background: linear-gradient(135deg, #4a1a6a 0%, #8040b0 100%); }

.coming-soon {
  opacity: .7;
  cursor: default;
  position: relative;
}
.coming-soon::after {
  content: '即將推出';
  position: absolute;
  top: 12px;
  right: 14px;
  background: rgba(255,255,255,.25);
  border-radius: 20px;
  font-size: 11px;
  padding: 2px 8px;
  letter-spacing: .5px;
}
.coming-soon:hover { transform: none; box-shadow: 0 2px 10px rgba(0,0,0,.08); }

/* ── IPOS 搜尋提示 ── */
.ipos-card {
  background: #fff;
  border-radius: 12px;
  padding: 24px 28px;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
  border-left: 4px solid #1a5276;
}
.ipos-card h3 {
  font-size: 15px;
  color: #1a5276;
  margin-bottom: 8px;
}
.ipos-card p {
  font-size: 13px;
  color: #666;
  line-height: 1.7;
}
.ipos-card code {
  background: #f5f5f5;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px;
  color: #333;
}
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="永旭 YSIPO Logo">
  <h1>文件產生器</h1>
</header>

<div class="wrap">
  <p class="section-title">選擇文件類型</p>

  <div class="btn-grid">
    <a class="doc-btn btn-patent" href="https://ysjoin-svg.github.io/patent-form/" target="_blank">
      <span class="icon">📋</span>
      <span class="label">專　利</span>
      <span class="sub">委任書 · 契約書</span>
    </a>
    <a class="doc-btn btn-trademark" href="https://ysjoin-svg.github.io/trademark-form/" target="_blank">
      <span class="icon">™</span>
      <span class="label">商　標</span>
      <span class="sub">委任書 · 契約書</span>
    </a>
    <span class="doc-btn btn-copyright coming-soon">
      <span class="icon">©</span>
      <span class="label">著 作 權</span>
      <span class="sub">委任書 · 契約書</span>
    </span>
    <span class="doc-btn btn-legal coming-soon">
      <span class="icon">⚖️</span>
      <span class="label">法　務</span>
      <span class="sub">合約書 · 聲明書</span>
    </span>
  </div>

  <p class="section-title">搭配 IPOS 客戶資料</p>
  <div class="ipos-card">
    <h3>⚙ 自動帶入客戶資料</h3>
    <p>
      若需從 IPOS-001 系統搜尋客戶並自動填入表單，請在辦公室內電腦執行橋接工具：<br><br>
      <code>node ipos_bridge.js</code><br><br>
      啟動後開啟 <code>http://localhost:3001</code>，以 IPOS 帳號登入後即可搜尋客戶、一鍵帶入各產生器。
    </p>
  </div>
</div>

</body>
</html>
